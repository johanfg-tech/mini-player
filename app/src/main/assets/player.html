<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mini Player</title>
<style>
  :root {
    --bg1: rgba(31, 33, 62, 0.96);
    --bg2: rgba(15, 16, 33, 0.98);
    --text: #f4f3ff;
    --muted: #a7a6d6;
    --soft: #b9b8e2;
    --accent: #8d7dff;
    --track: rgba(255, 255, 255, 0.12);
    --line: rgba(255, 255, 255, 0.08);
    --b1: rgba(90, 110, 255, .35); --b2: rgba(170, 130, 255, .9); --b3: rgba(80, 130, 255, .55);
    --p1: #9d8fff; --p2: #6b62ea; --p3: #5458d8;
    --f1: #7a69ff; --f2: #a091ff; --knob: #a597ff;
    --glowc: rgba(140, 110, 255, .35);
    --panel1: #1b1d38; --panel2: #0f1022;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: "Google Sans", Roboto, system-ui, sans-serif;
    color: var(--text);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; outline: none; }
  input { font: inherit; }
  svg { display: block; }

  .card {
    position: absolute; inset: 14px;
    border-radius: 30px;
    border: 1.5px solid transparent;
    background:
      linear-gradient(160deg, var(--bg1), var(--bg2)) padding-box,
      linear-gradient(135deg, var(--b1), var(--b2) 45%, var(--b3)) border-box;
    box-shadow: 0 0 14px var(--glowc);
    overflow: hidden;
  }
  .glow {
    position: absolute; inset: -30px;
    background-size: cover; background-position: center;
    filter: blur(30px) saturate(1.3);
    opacity: .22; pointer-events: none;
  }
  .photo {
    position: absolute; inset: 0; pointer-events: none; display: none;
    background-size: cover; background-position: center;
  }
  .photo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(8, 8, 18, .35), rgba(8, 8, 18, .78) 55%, rgba(8, 8, 18, .9));
  }
  body.hasBg .photo { display: block; }
  body.hasBg .glow { display: none; }
  .content { position: relative; height: 300px; padding: 34px 22px 18px; display: flex; flex-direction: column; }

  .toolbar {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 2px 6px;
    border-radius: 999px; background: rgba(255, 255, 255, .07); z-index: 5;
  }
  .tb { width: 30px; height: 24px; display: grid; place-items: center; border-radius: 10px; color: var(--soft); }
  .tb:active { background: rgba(255, 255, 255, .14); color: #fff; }

  .top { display: flex; gap: 16px; align-items: center; }
  .art {
    width: 104px; height: 104px; flex: none;
    border-radius: 18px; overflow: hidden;
    background: linear-gradient(145deg, var(--p3), var(--p1));
    box-shadow: 0 8px 20px rgba(0, 0, 0, .45);
    display: grid; place-items: center;
  }
  .art img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .art.has img { display: block; }
  .art.has .note { display: none; }
  .meta { flex: 1; min-width: 0; padding-right: 30px; }
  .title {
    font-size: 18px; font-weight: 600; line-height: 1.22;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .artist { margin-top: 6px; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .notice { margin-top: 6px; font-size: 11.5px; color: #ffc86b; min-height: 14px; }
  .side { position: absolute; top: 30px; right: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 4; }
  .sbtn { width: 36px; height: 36px; display: grid; place-items: center; color: var(--soft); border-radius: 12px; }
  .sbtn:active { background: rgba(255, 255, 255, .1); }
  .sbtn.on { color: var(--accent); }
  .sbtn:disabled { opacity: .3; }

  .progress { margin-top: 16px; padding: 10px 0; }
  .track { position: relative; height: 6px; border-radius: 99px; background: var(--track); }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--f1), var(--f2)); }
  .knob {
    position: absolute; top: 50%; left: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border-radius: 50%; background: var(--knob); box-shadow: 0 0 10px var(--knob);
  }
  .times { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--soft); font-variant-numeric: tabular-nums; }

  .controls { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .ctl { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; color: #e6e5ff; position: relative; }
  .ctl:active { background: rgba(255, 255, 255, .1); }
  .ctl.small { color: var(--soft); }
  .ctl.on { color: var(--accent); }
  .ctl.on::after { content: ""; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .play {
    width: 64px; height: 64px; border-radius: 50%;
    display: grid; place-items: center; color: #fff; position: relative;
    background: radial-gradient(circle at 35% 30%, var(--p1), var(--p2) 60%, var(--p3));
    box-shadow: 0 0 20px var(--glowc), inset 0 1px 0 rgba(255, 255, 255, .25);
  }
  .play:active { transform: scale(.95); }
  .play .spin {
    position: absolute; inset: -4px; border-radius: 50%;
    border: 3px solid transparent; border-top-color: #fff; opacity: 0;
    animation: rot .9s linear infinite;
  }
  .play.loading .spin { opacity: .9; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---------- panel (buscar / mixes) ---------- */
  .panel {
    position: absolute; inset: 0; z-index: 10;
    background: linear-gradient(170deg, var(--panel1), var(--panel2));
    display: none; flex-direction: column;
    padding: 36px 14px 12px;
  }
  .panel.open { display: flex; }
  .tabs { display: flex; gap: 6px; margin: 2px 0 10px; align-items: center; }
  .tab { font-size: 13.5px; padding: 6px 14px; border-radius: 99px; color: var(--soft); }
  .tab.on { background: color-mix(in srgb, var(--accent) 24%, transparent); color: #fff; }
  .tabs .spacer { flex: 1; }
  .view { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .view.on { display: flex; }
  .field {
    flex: 1; height: 40px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(255, 255, 255, .06); color: var(--text); padding: 0 12px; font-size: 15px; outline: none;
    user-select: text; -webkit-user-select: text; min-width: 0;
  }
  .field:focus { border-color: rgba(141, 125, 255, .7); }
  .row { display: flex; gap: 8px; align-items: center; }
  .list::-webkit-scrollbar { width: 0; height: 0; }
  .list { flex: 1; overflow-y: auto; touch-action: pan-y; margin-top: 8px; min-height: 0; }
  .item { display: flex; gap: 10px; align-items: center; width: 100%; padding: 6px; border-radius: 12px; text-align: left; }
  .item:active { background: rgba(255, 255, 255, .08); }
  .item img, .thumb { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; flex: none; background: #2a2c55; }
  .item .info { min-width: 0; flex: 1; }
  .item .t { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .item.playing .t { color: var(--accent); }
  .mini { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 10px; color: var(--soft); }
  .mini:active { background: rgba(255, 255, 255, .1); color: #fff; }
  .empty { padding: 26px 10px; text-align: center; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .btn {
    height: 40px; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--p1), var(--p3)); flex: none;
  }
  .btn.ghost { background: rgba(255, 255, 255, .08); font-weight: 500; }
  .btn.danger { background: #d9475b; }
  .btn:active { opacity: .85; }
  .mixtile {
    width: 46px; height: 46px; border-radius: 12px; flex: none; display: grid; place-items: center;
    font-weight: 700; font-size: 18px; color: #fff; overflow: hidden; position: relative;
  }
  .mixtile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .newmix { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px; border-radius: 12px; color: #c9c0ff; font-weight: 600; font-size: 14px; }
  .newmix .mixtile { background: rgba(141, 125, 255, .18); color: #c9c0ff; }

  .mixhead { display: flex; align-items: center; gap: 6px; }
  .mixhead .name { flex: 1; min-width: 0; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mixhead .count { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }

  /* hoja "Guardar en…" */
  .sheet {
    position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column;
    background: rgba(9, 10, 22, .6);
  }
  .sheet.open { display: flex; }
  .sheet .box {
    margin-top: auto; background: var(--panel1); border-top: 1px solid rgba(255, 255, 255, .1);
    border-radius: 22px 22px 0 0; padding: 16px 14px 14px; max-height: 88%; display: flex; flex-direction: column;
  }
  .sheet h3 { font-size: 16px; }
  .sheet .song { font-size: 12.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .check { width: 24px; height: 24px; border-radius: 8px; border: 2px solid rgba(255, 255, 255, .3); display: grid; place-items: center; flex: none; }
  .check.on { background: var(--accent); border-color: var(--accent); }
  .check svg { opacity: 0; }
  .check.on svg { opacity: 1; }

  /* ---------- temas ---------- */
  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .theme {
    position: relative; height: 74px; border-radius: 16px; overflow: hidden; text-align: left;
    padding: 10px 12px; display: flex; flex-direction: column; justify-content: flex-end;
    border: 2px solid transparent;
  }
  .theme.on { border-color: #fff; }
  .theme .tn { font-size: 13.5px; font-weight: 700; color: #fff; position: relative; }
  .theme .dots { display: flex; gap: 4px; margin-top: 4px; position: relative; }
  .theme .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; border: 1px solid rgba(255,255,255,.3); }
  .bgrow { display: flex; gap: 8px; margin: 4px 0 12px; }
  .bgrow .btn { flex: 1; }
  .btn:disabled { opacity: .4; }
  .sectitle { font-size: 12px; color: var(--muted); margin: 4px 2px 8px; text-transform: uppercase; letter-spacing: .08em; }

  /* ---------- modo burbuja ---------- */
  .bubble {
    position: absolute; inset: 4px; border-radius: 50%; display: none;
    background: linear-gradient(145deg, var(--p3), var(--p1));
    background-size: cover; background-position: center;
    box-shadow: 0 0 0 2px var(--b2), 0 0 8px var(--glowc);
    overflow: hidden;
  }
  .bubble .state { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10, 10, 25, .35); }
  body.isBubble .card { display: none; }
  body.isBubble .bubble { display: block; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="glow" id="glow"></div>
  <div class="photo" id="photo"></div>

  <div class="toolbar">
    <button class="tb" id="bSearch" aria-label="Buscar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button class="tb" id="bMixes" aria-label="Mis mixes">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h12M3 12h12M3 18h7"/><path d="M17 18V8l5-1"/><circle cx="15" cy="18" r="2"/></svg>
    </button>
    <button class="tb" id="bThemes" aria-label="Temas">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.5-1-.1-2.2 1.2-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7" r="1.2" fill="currentColor"/><circle cx="15" cy="7.5" r="1.2" fill="currentColor"/></svg>
    </button>
    <button class="tb" id="bMin" aria-label="Hacer burbuja">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg>
    </button>
    <button class="tb" id="bClose" aria-label="Cerrar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <div class="side">
    <button class="sbtn" id="heart" aria-label="Favorito" disabled>
      <svg width="22" height="22" viewBox="0 0 24 24"><path id="heartPath" fill="none" stroke="currentColor" stroke-width="2" d="M12 20.5s-7.5-4.6-9.3-9.2C1.6 8.4 3.5 4.5 7.3 4.5c2 0 3.6 1.1 4.7 2.7 1.1-1.6 2.7-2.7 4.7-2.7 3.8 0 5.7 3.9 4.6 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>
    </button>
    <button class="sbtn" id="addMix" aria-label="Agregar a un mix" disabled>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h11M3 12h11M3 18h7"/><path d="M18 13v8M14 17h8"/></svg>
    </button>
  </div>

  <div class="content">
    <div class="top">
      <div class="art" id="art">
        <img id="artImg" alt="">
        <svg class="note" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      </div>
      <div class="meta">
        <div class="title" id="title">Nada sonando</div>
        <div class="artist" id="artist">Toca la lupa para buscar música</div>
        <div class="notice" id="notice"></div>
      </div>
    </div>

    <div class="progress" id="progress">
      <div class="track" id="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
    </div>
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>

    <div class="controls">
      <button class="ctl small" id="bShuffle" aria-label="Aleatorio">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
      </button>
      <button class="ctl" id="bPrev" aria-label="Anterior">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="2.6" height="16" rx="1.1"/><path d="M19.5 5.2v13.6a1 1 0 0 1-1.55.83L8.6 13.1a1.3 1.3 0 0 1 0-2.2l9.35-6.53a1 1 0 0 1 1.55.83z"/></svg>
      </button>
      <button class="play" id="bPlay" aria-label="Reproducir o pausar">
        <span class="spin"></span>
        <svg id="icoPlay" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4a1.1 1.1 0 0 0 1.7.92l11-7.2a1.1 1.1 0 0 0 0-1.84l-11-7.2A1.1 1.1 0 0 0 7 4.8z"/></svg>
        <svg id="icoPause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5.5" y="4" width="4.6" height="16" rx="1.6"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.6"/></svg>
      </button>
      <button class="ctl" id="bNext" aria-label="Siguiente">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="17.4" y="4" width="2.6" height="16" rx="1.1"/><path d="M4.5 5.2v13.6a1 1 0 0 0 1.55.83l9.35-6.53a1.3 1.3 0 0 0 0-2.2L6.05 4.37a1 1 0 0 0-1.55.83z"/></svg>
      </button>
      <button class="ctl small" id="bRepeat" aria-label="Repetir">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>
  </div>

  <!-- Panel de búsqueda y mixes -->
  <div class="panel" id="panel">
    <div class="tabs">
      <button class="tb" id="bBack" aria-label="Volver al reproductor">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button class="tab on" id="tabSearch">Buscar</button>
      <button class="tab" id="tabMixes">Mis mixes</button>
      <button class="tab" id="tabThemes">Temas</button>
    </div>

    <div class="view on" id="vSearch">
      <div class="row">
        <input class="field" id="q" type="search" enterkeyhint="search" placeholder="Canción o artista…" spellcheck="false" autocomplete="off">
      </div>
      <div class="list" id="results"><div class="empty">Escribe y toca buscar en el teclado.<br>Con el <b>+</b> guardas una canción en tus mixes.</div></div>
    </div>

    <div class="view" id="vMixes">
      <div class="list" id="mixList" style="margin-top:0"></div>
    </div>

    <div class="view" id="vMix">
      <div class="mixhead">
        <button class="tb" id="mixBack" aria-label="Volver a mis mixes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div style="flex:1;min-width:0">
          <div class="name" id="mixName"></div>
          <div class="count" id="mixCount"></div>
        </div>
        <button class="mini" id="mixRename" aria-label="Cambiar nombre">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="mini" id="mixDelete" aria-label="Borrar mix">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
        </button>
      </div>
      <div class="row" id="renameRow" style="display:none;margin-top:8px">
        <input class="field" id="renameInput" maxlength="40" placeholder="Nombre del mix">
        <button class="btn" id="renameOk">Guardar</button>
      </div>
      <div class="row" id="deleteRow" style="display:none;margin-top:8px">
        <div style="flex:1;font-size:13px;color:#ffb3bd">¿Borrar este mix? Las canciones no se borran de los demás.</div>
        <button class="btn ghost" id="deleteNo">No</button>
        <button class="btn danger" id="deleteYes">Borrar</button>
      </div>
      <div class="actions">
        <button class="btn" id="mixPlay">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4a1.1 1.1 0 0 0 1.7.92l11-7.2a1.1 1.1 0 0 0 0-1.84l-11-7.2A1.1 1.1 0 0 0 7 4.8z"/></svg>
          Reproducir
        </button>
        <button class="btn ghost" id="mixShuffle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
          Aleatorio
        </button>
      </div>
      <div class="list" id="mixSongs"></div>
    </div>

    <div class="view" id="vThemes">
      <div class="list" style="margin-top:0">
        <div class="sectitle">Tu imagen de fondo</div>
        <div class="bgrow">
          <button class="btn" id="bgPick">Elegir imagen</button>
          <button class="btn ghost" id="bgClear" disabled>Quitar</button>
        </div>
        <div class="sectitle">Colores</div>
        <div class="themes" id="themeGrid"></div>
      </div>
    </div>

    <!-- Hoja: guardar canción en mixes -->
    <div class="sheet" id="sheet">
      <div class="box">
        <div class="row">
          <div style="flex:1;min-width:0">
            <h3>Guardar en mix</h3>
            <div class="song" id="sheetSong"></div>
          </div>
          <button class="btn" id="sheetDone">Listo</button>
        </div>
        <div class="list" id="sheetList"></div>
        <div class="row" style="margin-top:8px">
          <input class="field" id="sheetNew" maxlength="40" placeholder="Nuevo mix (ej: Reggaetón, Concentrarme)">
          <button class="btn" id="sheetCreate">Crear</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="bubble" id="bubble">
  <div class="state" id="bubbleState">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
  </div>
</div>

<script>
// ---------------- puente con Android ----------------
const pending = {};
let seq = 0;
function call(name, ...args) {
  return new Promise((resolve) => {
    const id = String(++seq);
    pending[id] = resolve;
    Android.call(name, JSON.stringify(args), id);
  });
}
function send(name, ...args) { Android.call(name, JSON.stringify(args), ''); }
window.__cb = (id, value) => { const f = pending[id]; delete pending[id]; if (f) f(value); };

const $ = (id) => document.getElementById(id);
const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const PLUS = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const XS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const COLORS = ['#7a69ff', '#e0739a', '#45b3a6', '#e3a04a', '#5d8df0', '#b06ad9', '#d9605a', '#59b86b'];

let st = null, artId = null, seeking = false, results = [];
let mixes = [];
let openMixId = null, sheetSong = null;

function esc(s) { return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(t) {
  if (!isFinite(t) || t < 0) t = 0;
  t = Math.floor(t);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
function thumb(id) { return `https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg`; }
function currentSong() {
  if (!st || !st.id) return null;
  return { id: st.id, title: st.title || '', channel: st.channel || '', duration: st.dur ? fmt(st.dur) : '' };
}

// ---------------- temas ----------------
const THEMES = [
  { id: 'crepusculo', name: 'Crepúsculo', bg: ['rgba(31,33,62,.96)', 'rgba(15,16,33,.98)'], panel: ['#1b1d38', '#0f1022'], accent: '#8d7dff', muted: '#a7a6d6', soft: '#b9b8e2', border: ['rgba(90,110,255,.35)', 'rgba(170,130,255,.9)', 'rgba(80,130,255,.55)'], play: ['#9d8fff', '#6b62ea', '#5458d8'], fill: ['#7a69ff', '#a091ff'], glow: 'rgba(140,110,255,.4)' },
  { id: 'carmesi', name: 'Luna carmesí', bg: ['rgba(28,10,14,.96)', 'rgba(10,4,6,.98)'], panel: ['#22090e', '#0c0305'], accent: '#ff4a5a', muted: '#c99aa0', soft: '#e0b8bd', border: ['rgba(120,10,25,.5)', 'rgba(230,40,60,.95)', 'rgba(90,0,15,.6)'], play: ['#ff5a66', '#d11a2e', '#8f0d1c'], fill: ['#b3121f', '#ff4a5a'], glow: 'rgba(230,30,50,.45)' },
  { id: 'sakura', name: 'Sakura', bg: ['rgba(44,20,36,.96)', 'rgba(22,10,20,.98)'], panel: ['#2c1424', '#150a13'], accent: '#ff9ac1', muted: '#d6a9bf', soft: '#efc9da', border: ['rgba(255,150,190,.35)', 'rgba(255,170,205,.95)', 'rgba(200,110,160,.5)'], play: ['#ffb3d1', '#f06a9f', '#c94a80'], fill: ['#e85d95', '#ffb3d1'], glow: 'rgba(255,140,185,.45)' },
  { id: 'oceano', name: 'Océano', bg: ['rgba(10,30,52,.96)', 'rgba(5,15,30,.98)'], panel: ['#0b1d33', '#05101e'], accent: '#4cc3ff', muted: '#93b6cf', soft: '#b5d3e8', border: ['rgba(40,120,220,.4)', 'rgba(70,200,255,.95)', 'rgba(20,90,180,.55)'], play: ['#6fd2ff', '#2a92e8', '#1b62b8'], fill: ['#2a92e8', '#6fd2ff'], glow: 'rgba(60,170,255,.45)' },
  { id: 'bosque', name: 'Bosque', bg: ['rgba(14,36,24,.96)', 'rgba(6,18,11,.98)'], panel: ['#10261a', '#06130b'], accent: '#5fe08c', muted: '#9cc4a8', soft: '#bfe0c8', border: ['rgba(40,140,80,.4)', 'rgba(95,224,140,.9)', 'rgba(30,110,60,.55)'], play: ['#7cf0a4', '#33b866', '#1f8247'], fill: ['#2fa85c', '#7cf0a4'], glow: 'rgba(80,220,130,.4)' },
  { id: 'neon', name: 'Neón', bg: ['rgba(18,10,36,.96)', 'rgba(7,4,15,.98)'], panel: ['#140a28', '#07040f'], accent: '#00e5ff', muted: '#a99fd0', soft: '#cfc6f2', border: ['rgba(255,0,200,.7)', 'rgba(0,229,255,.95)', 'rgba(255,0,200,.7)'], play: ['#4df0ff', '#b04dff', '#ff2bd6'], fill: ['#ff2bd6', '#00e5ff'], glow: 'rgba(0,229,255,.5)' },
  { id: 'oro', name: 'Oro negro', bg: ['rgba(24,21,12,.96)', 'rgba(10,9,6,.98)'], panel: ['#18150c', '#0a0906'], accent: '#f2c14e', muted: '#c4b48c', soft: '#e3d3a8', border: ['rgba(140,110,40,.45)', 'rgba(242,193,78,.95)', 'rgba(120,90,30,.55)'], play: ['#ffd877', '#e0a82e', '#a8771a'], fill: ['#c8921f', '#ffd877'], glow: 'rgba(242,193,78,.4)' },
  { id: 'lava', name: 'Lava', bg: ['rgba(38,16,8,.96)', 'rgba(18,7,3,.98)'], panel: ['#261208', '#120804'], accent: '#ff7a2f', muted: '#d0a48c', soft: '#ecc5ae', border: ['rgba(200,60,10,.5)', 'rgba(255,122,47,.95)', 'rgba(160,40,5,.6)'], play: ['#ff9d5c', '#f05a1a', '#b8360a'], fill: ['#e0450f', '#ffb066'], glow: 'rgba(255,110,40,.45)' },
  { id: 'hielo', name: 'Hielo', bg: ['rgba(20,36,48,.96)', 'rgba(10,20,28,.98)'], panel: ['#14252f', '#0a141b'], accent: '#a8ecff', muted: '#a3bfcc', soft: '#d2e9f2', border: ['rgba(150,220,255,.4)', 'rgba(220,248,255,.95)', 'rgba(120,190,230,.5)'], play: ['#e2f8ff', '#8fd8f2', '#5aaed0'], fill: ['#6cc4e6', '#e2f8ff'], glow: 'rgba(170,230,255,.45)' },
  { id: 'sombra', name: 'Sombra', bg: ['rgba(22,22,24,.96)', 'rgba(8,8,9,.98)'], panel: ['#161618', '#09090a'], accent: '#ececec', muted: '#a3a3a8', soft: '#cfcfd4', border: ['rgba(255,255,255,.15)', 'rgba(255,255,255,.6)', 'rgba(255,255,255,.15)'], play: ['#fafafa', '#bdbdbd', '#8a8a8a'], fill: ['#9a9a9a', '#ffffff'], glow: 'rgba(255,255,255,.18)' },
];
let themeId = 'crepusculo';
function applyTheme(id) {
  const t = THEMES.find((x) => x.id === id) || THEMES[0];
  themeId = t.id;
  const r = document.documentElement.style;
  r.setProperty('--bg1', t.bg[0]); r.setProperty('--bg2', t.bg[1]);
  r.setProperty('--panel1', t.panel[0]); r.setProperty('--panel2', t.panel[1]);
  r.setProperty('--accent', t.accent); r.setProperty('--muted', t.muted); r.setProperty('--soft', t.soft);
  r.setProperty('--b1', t.border[0]); r.setProperty('--b2', t.border[1]); r.setProperty('--b3', t.border[2]);
  r.setProperty('--p1', t.play[0]); r.setProperty('--p2', t.play[1]); r.setProperty('--p3', t.play[2]);
  r.setProperty('--f1', t.fill[0]); r.setProperty('--f2', t.fill[1]); r.setProperty('--knob', t.accent);
  r.setProperty('--glowc', t.glow);
  const light = t.id === 'sombra' || t.id === 'hielo';
  $('bPlay').style.color = light ? '#111' : '#fff';
}
function renderThemes() {
  $('themeGrid').innerHTML = THEMES.map((t) => `
    <button class="theme ${t.id === themeId ? 'on' : ''}" data-id="${t.id}"
      style="background:linear-gradient(150deg, ${t.panel[0]}, ${t.panel[1]}); box-shadow: inset 0 0 0 1px ${t.border[1]}">
      <span class="tn">${esc(t.name)}</span>
      <span class="dots"><i style="background:${t.play[0]}"></i><i style="background:${t.play[1]}"></i><i style="background:${t.accent}"></i></span>
    </button>`).join('');
  $('themeGrid').querySelectorAll('.theme').forEach((b) => {
    b.onclick = () => { applyTheme(b.dataset.id); send('setTheme', themeId); renderThemes(); };
  });
}
window.__bg = (url) => {
  document.body.classList.toggle('hasBg', !!url);
  $('photo').style.backgroundImage = url ? `url("${url}")` : '';
  $('bgClear').disabled = !url;
};
call('getTheme').then((id) => { applyTheme(id); });
send('getBg');

// ---------------- mixes ----------------
function saveMixes() { send('setMixes', mixes); }
function getMix(id) { return mixes.find((m) => m.id === id); }
function favMix() {
  let f = getMix('fav');
  if (!f) { f = { id: 'fav', name: 'Favoritos', songs: [] }; mixes.unshift(f); }
  return f;
}
function inMix(mix, songId) { return !!mix.songs.find((s) => s.id === songId); }
function toggleInMix(mix, song) {
  const i = mix.songs.findIndex((s) => s.id === song.id);
  if (i >= 0) mix.songs.splice(i, 1);
  else mix.songs.unshift({ id: song.id, title: song.title, channel: song.channel, duration: song.duration || '' });
  saveMixes();
}
function createMix(name, song) {
  name = (name || '').trim();
  if (!name) return null;
  const m = { id: 'm' + Date.now(), name, songs: [] };
  if (song) m.songs.push({ id: song.id, title: song.title, channel: song.channel, duration: song.duration || '' });
  mixes.push(m);
  saveMixes();
  return m;
}
function colorFor(mix) { let h = 0; for (const c of mix.id) h = (h * 31 + c.charCodeAt(0)) | 0; return COLORS[Math.abs(h) % COLORS.length]; }
function tile(mix) {
  if (mix.id === 'fav') return `<div class="mixtile" style="background:linear-gradient(135deg,#8d7dff,#e0739a)">♥</div>`;
  const first = mix.songs[0];
  return `<div class="mixtile" style="background:${colorFor(mix)}">${esc(mix.name.charAt(0).toUpperCase())}${first ? `<img src="${thumb(first.id)}" alt="" style="opacity:.55" onerror="this.remove()">` : ''}</div>`;
}

call('getMixes').then((m) => { mixes = Array.isArray(m) ? m : []; favMix(); refreshHeart(); });

// ---------------- estado del reproductor ----------------
function setProgress(f) {
  f = Math.min(1, Math.max(0, f || 0));
  $('fill').style.width = (f * 100) + '%';
  $('knob').style.left = (f * 100) + '%';
}
function setArt(id) {
  if (id === artId) return;
  artId = id;
  const img = $('artImg');
  if (!id) {
    $('art').classList.remove('has'); $('glow').style.backgroundImage = ''; $('bubble').style.backgroundImage = '';
    return;
  }
  img.onerror = () => { if (!img.src.includes('mqdefault')) img.src = thumb(id); };
  img.onload = () => {
    $('art').classList.add('has');
    $('glow').style.backgroundImage = `url("${img.src}")`;
    $('bubble').style.backgroundImage = `url("${img.src}")`;
  };
  img.src = `https://i.ytimg.com/vi/${encodeURIComponent(id)}/maxresdefault.jpg`;
}
function refreshHeart() {
  const has = !!(st && st.id);
  const on = has && mixes.length && inMix(favMix(), st.id);
  $('heart').disabled = !has;
  $('addMix').disabled = !has;
  $('heart').classList.toggle('on', !!on);
  $('heartPath').setAttribute('fill', on ? 'currentColor' : 'none');
}

let lastPlayingId = null;
window.__state = (s) => {
  st = s;
  document.body.classList.toggle('isBubble', !!s.bubble);
  const has = !!s.id;
  $('title').textContent = has ? (s.title || 'Cargando…') : 'Nada sonando';
  $('artist').textContent = has ? (s.channel || '') : 'Toca la lupa para buscar música';
  $('notice').textContent = s.notice || (s.loading && has ? 'Cargando…' : '');
  setArt(s.id);
  refreshHeart();
  $('icoPlay').style.display = s.paused ? '' : 'none';
  $('icoPause').style.display = s.paused ? 'none' : '';
  $('bPlay').classList.toggle('loading', !!(s.loading && has));
  $('bubbleState').style.opacity = s.paused ? '1' : '0';
  $('bShuffle').classList.toggle('on', !!s.shuffle);
  $('bRepeat').classList.toggle('on', !!s.repeat);
  if (!seeking) { setProgress(s.dur ? s.cur / s.dur : 0); $('tCur').textContent = fmt(s.cur); }
  $('tDur').textContent = fmt(s.dur);
  if (s.id !== lastPlayingId) {
    lastPlayingId = s.id;
    if ($('vMix').classList.contains('on')) renderMix();
  }
};

// ---------------- arrastrar la ventana ----------------
document.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button, input, .progress, .panel')) return;
  send('drag');
}, true);

// ---------------- controles ----------------
$('bPlay').onclick = () => send('toggle');
$('bNext').onclick = () => send('next');
$('bPrev').onclick = () => send('prev');
$('bShuffle').onclick = async () => $('bShuffle').classList.toggle('on', await call('shuffle'));
$('bRepeat').onclick = async () => $('bRepeat').classList.toggle('on', await call('repeat'));
$('heart').onclick = () => { const s = currentSong(); if (s) { toggleInMix(favMix(), s); refreshHeart(); } };
$('addMix').onclick = () => { const s = currentSong(); if (s) { openPanel('mixes'); openSheet(s); } };
$('bMin').onclick = () => { closePanel(); send('mode', 'bubble'); };
$('bThemes').onclick = () => openPanel('themes');
$('bgPick').onclick = () => send('pickBg');
$('bgClear').onclick = () => send('clearBg');
$('bClose').onclick = () => send('close');

const prog = $('progress');
function fracAt(e) { const r = $('track').getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); }
prog.addEventListener('pointerdown', (e) => {
  if (!st || !st.dur) return;
  seeking = true; prog.setPointerCapture(e.pointerId);
  const f = fracAt(e); setProgress(f); $('tCur').textContent = fmt(f * st.dur);
});
prog.addEventListener('pointermove', (e) => {
  if (!seeking) return;
  const f = fracAt(e); setProgress(f); $('tCur').textContent = fmt(f * st.dur);
});
prog.addEventListener('pointerup', (e) => { if (!seeking) return; seeking = false; send('seek', fracAt(e)); });
prog.addEventListener('pointercancel', () => { seeking = false; });

// ---------------- panel ----------------
function showView(v) {
  ['vSearch', 'vMixes', 'vMix', 'vThemes'].forEach((id) => $(id).classList.toggle('on', id === v));
  $('tabSearch').classList.toggle('on', v === 'vSearch');
  $('tabMixes').classList.toggle('on', v === 'vMixes' || v === 'vMix');
  $('tabThemes').classList.toggle('on', v === 'vThemes');
}
function openPanel(which) {
  $('panel').classList.add('open');
  send('panel', true);
  if (which === 'mixes') { showView('vMixes'); renderMixes(); }
  else if (which === 'themes') { showView('vThemes'); renderThemes(); }
  else { showView('vSearch'); setTimeout(() => $('q').focus(), 250); }
}
function closePanel() {
  document.activeElement && document.activeElement.blur && document.activeElement.blur();
  closeSheet();
  $('panel').classList.remove('open');
  send('panel', false);
}
$('bSearch').onclick = () => openPanel('search');
$('bMixes').onclick = () => openPanel('mixes');
$('bBack').onclick = closePanel;
$('tabSearch').onclick = () => { showView('vSearch'); };
$('tabMixes').onclick = () => { showView('vMixes'); renderMixes(); };
$('tabThemes').onclick = () => { showView('vThemes'); renderThemes(); };

// ---------------- búsqueda ----------------
function songRow(it, i, opts) {
  const playing = st && st.id === it.id ? ' playing' : '';
  const sub = esc(it.channel) + (it.duration ? ' · ' + esc(it.duration) : '');
  const action = opts.remove
    ? `<button class="mini" data-act="remove" data-i="${i}" aria-label="Quitar del mix">${XS}</button>`
    : `<button class="mini" data-act="add" data-i="${i}" aria-label="Guardar en un mix">${PLUS}</button>`;
  return `<div class="item${playing}" data-i="${i}">
      <img src="${thumb(it.id)}" alt="" onerror="this.style.visibility='hidden'">
      <div class="info"><div class="t">${esc(it.title)}</div><div class="s">${sub}</div></div>
      ${action}
    </div>`;
}
function bindSongList(el, items, opts) {
  el.querySelectorAll('.item').forEach((row) => {
    row.onclick = (e) => {
      const btn = e.target.closest('.mini');
      const it = items[+row.dataset.i];
      if (!it) return;
      if (btn && btn.dataset.act === 'add') { openSheet(it); return; }
      if (btn && btn.dataset.act === 'remove') { opts.onRemove(it); return; }
      send('play', it, items, false);
      closePanel();
    };
  });
}
function showResults(items, emptyMsg) {
  const el = $('results');
  if (!items || !items.length) { el.innerHTML = `<div class="empty">${emptyMsg}</div>`; return; }
  el.innerHTML = items.map((it, i) => songRow(it, i, {})).join('');
  bindSongList(el, items, {});
}
async function doSearch() {
  const q = $('q').value.trim();
  if (!q) return;
  $('q').blur();
  $('results').innerHTML = '<div class="empty">Buscando…</div>';
  const r = await call('search', q);
  if (!r || r.error) { showResults([], 'No se pudo buscar. Revisa tu conexión.'); return; }
  results = r;
  showResults(results, 'Sin resultados');
}
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });

// ---------------- lista de mixes ----------------
function renderMixes() {
  const el = $('mixList');
  let html = `<button class="newmix" id="newMixBtn"><div class="mixtile">+</div>Nuevo mix</button>
    <div class="row" id="newMixRow" style="display:none;margin:4px 0 8px">
      <input class="field" id="newMixName" maxlength="40" placeholder="Nombre (ej: Reggaetón, Concentrarme)">
      <button class="btn" id="newMixOk">Crear</button>
    </div>`;
  html += mixes.map((m) => `
    <div class="item" data-id="${esc(m.id)}">
      ${tile(m)}
      <div class="info"><div class="t">${esc(m.name)}</div><div class="s">${m.songs.length} ${m.songs.length === 1 ? 'canción' : 'canciones'}</div></div>
      <button class="mini" data-act="play" aria-label="Reproducir mix">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4a1.1 1.1 0 0 0 1.7.92l11-7.2a1.1 1.1 0 0 0 0-1.84l-11-7.2A1.1 1.1 0 0 0 7 4.8z"/></svg>
      </button>
    </div>`).join('');
  el.innerHTML = html;
  $('newMixBtn').onclick = () => { $('newMixRow').style.display = 'flex'; $('newMixName').focus(); };
  const create = () => {
    const m = createMix($('newMixName').value);
    if (m) { renderMixes(); }
  };
  $('newMixOk').onclick = create;
  $('newMixName').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); create(); } });
  el.querySelectorAll('.item').forEach((row) => {
    row.onclick = (e) => {
      const m = getMix(row.dataset.id);
      if (!m) return;
      if (e.target.closest('.mini')) { playMix(m, false); return; }
      openMix(m.id);
    };
  });
}
function playMix(m, shuffled) {
  if (!m || !m.songs.length) return;
  send('setShuffle', !!shuffled);
  send('play', null, m.songs, !!shuffled);
  closePanel();
}

// ---------------- detalle de un mix ----------------
function openMix(id) {
  openMixId = id;
  $('renameRow').style.display = 'none';
  $('deleteRow').style.display = 'none';
  showView('vMix');
  renderMix();
}
function renderMix() {
  const m = getMix(openMixId);
  if (!m) { showView('vMixes'); renderMixes(); return; }
  $('mixName').textContent = m.name;
  $('mixCount').textContent = `${m.songs.length} ${m.songs.length === 1 ? 'canción' : 'canciones'}`;
  $('mixPlay').disabled = $('mixShuffle').disabled = !m.songs.length;
  const el = $('mixSongs');
  if (!m.songs.length) {
    el.innerHTML = '<div class="empty">Este mix está vacío.<br>Busca canciones y tócales el <b>+</b> para agregarlas aquí.</div>';
    return;
  }
  el.innerHTML = m.songs.map((s, i) => songRow(s, i, { remove: true })).join('');
  bindSongList(el, m.songs, {
    remove: true,
    onRemove: (song) => { toggleInMix(m, song); renderMix(); refreshHeart(); },
  });
}
$('mixBack').onclick = () => { showView('vMixes'); renderMixes(); };
$('mixPlay').onclick = () => playMix(getMix(openMixId), false);
$('mixShuffle').onclick = () => playMix(getMix(openMixId), true);
$('mixRename').onclick = () => {
  const m = getMix(openMixId); if (!m) return;
  $('deleteRow').style.display = 'none';
  $('renameRow').style.display = 'flex';
  $('renameInput').value = m.name;
  $('renameInput').focus();
};
const doRename = () => {
  const m = getMix(openMixId); const n = $('renameInput').value.trim();
  if (m && n) { m.name = n; saveMixes(); }
  $('renameRow').style.display = 'none';
  $('renameInput').blur();
  renderMix();
};
$('renameOk').onclick = doRename;
$('renameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doRename(); } });
$('mixDelete').onclick = () => { $('renameRow').style.display = 'none'; $('deleteRow').style.display = 'flex'; };
$('deleteNo').onclick = () => { $('deleteRow').style.display = 'none'; };
$('deleteYes').onclick = () => {
  mixes = mixes.filter((m) => m.id !== openMixId);
  saveMixes();
  refreshHeart();
  showView('vMixes');
  renderMixes();
};

// ---------------- hoja "Guardar en mix" ----------------
function openSheet(song) {
  sheetSong = song;
  $('sheetSong').textContent = song.title + (song.channel ? ' · ' + song.channel : '');
  $('sheetNew').value = '';
  renderSheet();
  $('sheet').classList.add('open');
}
function closeSheet() { $('sheet').classList.remove('open'); sheetSong = null; }
function renderSheet() {
  const el = $('sheetList');
  el.innerHTML = mixes.map((m) => `
    <div class="item" data-id="${esc(m.id)}">
      ${tile(m)}
      <div class="info"><div class="t">${esc(m.name)}</div><div class="s">${m.songs.length} ${m.songs.length === 1 ? 'canción' : 'canciones'}</div></div>
      <div class="check ${inMix(m, sheetSong.id) ? 'on' : ''}">${CHECK}</div>
    </div>`).join('');
  el.querySelectorAll('.item').forEach((row) => {
    row.onclick = () => {
      const m = getMix(row.dataset.id);
      if (!m || !sheetSong) return;
      toggleInMix(m, sheetSong);
      renderSheet();
      refreshHeart();
    };
  });
}
const sheetCreate = () => {
  if (!sheetSong) return;
  const m = createMix($('sheetNew').value, sheetSong);
  if (m) { $('sheetNew').value = ''; $('sheetNew').blur(); renderSheet(); }
};
$('sheetCreate').onclick = sheetCreate;
$('sheetNew').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sheetCreate(); } });
$('sheetDone').onclick = () => {
  closeSheet();
  if ($('vMixes').classList.contains('on')) renderMixes();
  if ($('vMix').classList.contains('on')) renderMix();
};
$('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) $('sheetDone').onclick(); });
</script>
</body>
</html>
