plugins {
    id 'com.android.application'
}

android {
    namespace 'com.johan.miniplayer'
    compileSdk 35

    defaultConfig {
        applicationId "com.johan.miniplayer"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    packaging {
        resources {
            excludes += ['META-INF/README.md', 'META-INF/CHANGES', 'META-INF/COPYRIGHT',
                         'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/*.kotlin_module', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

base {
    archivesName = "MiniPlayer"
}

dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.4'
}
