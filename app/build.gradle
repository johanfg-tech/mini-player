plugins {
    id 'com.android.application'
}

android {
    namespace 'com.johan.miniplayer'
    compileSdk 35

    defaultConfig {
        applicationId "com.johan.miniplayer"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

base {
    archivesName = "MiniPlayer"
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
